# ==============================================================================
# Bitbucket Pipelines - CI/CD for GoDaddy Deployment
# ==============================================================================
# Variables requeridas en Bitbucket (Repository Settings -> Repository Variables):
#   - GODADDY_HOST:          Host/IP del servidor (ej. ftp.midominio.com)
#   - GODADDY_USER:          Usuario FTP / cPanel
#   - GODADDY_PASSWORD:      Contraseña FTP / cPanel (Marcar como Secured)
#   - GODADDY_FRONTEND_PATH: Ruta en el hosting para la web estática (ej. /public_html)
#   - GODADDY_BACKEND_PATH:  (Opcional) Ruta de la app Node en cPanel (ej. /cms)
#   - GITHUB_TOKEN:          Token de acceso personal de GitHub con permisos de repo (Secured)
#   - GITHUB_REPO:           Repositorio en GitHub para GoDaddy (ej. Intelligis-Colombia/smartmaps-cms)
# ==============================================================================

image: node:22-alpine

definitions:
  caches:
    npm-frontend: frontend/node_modules
    npm-backend: backend/node_modules

pipelines:
  branches:
    prod:
      - step:
          name: Build Frontend (Astro SSG)
          caches:
            - npm-frontend
          script:
            - cd frontend
            - npm ci
            - npm run build
          artifacts:
            - frontend/dist/**
      - step:
          name: Deploy Frontend to GoDaddy
          trigger: manual
          script:
            - echo "Checking local build artifacts:"
            - ls -la frontend/dist
            - pipe: atlassian/ftp-deploy:0.7.0
              variables:
                USER: $GODADDY_USER
                PASSWORD: $GODADDY_PASSWORD
                SERVER: $GODADDY_HOST
                REMOTE_PATH: $GODADDY_FRONTEND_PATH
                LOCAL_PATH: 'frontend/dist'
                DELETE_FLAG: 'true'
                DEBUG: 'true'
      - step:
          name: Sync Backend to GitHub (GoDaddy Node App)
          script:
            - apk add --no-cache git
            - cd backend
            - git init -b main
            - git config user.name "Bitbucket CI"
            - git config user.email "ci@bitbucket.org"
            - git add .
            - git commit -m "Sync backend from Bitbucket"
            - git push https://x-access-token:$GITHUB_TOKEN@github.com/${GITHUB_REPO}.git main --force

  custom:
    deploy-frontend:
      - step:
          name: Build Frontend
          caches:
            - npm-frontend
          script:
            - cd frontend
            - npm ci
            - npm run build
          artifacts:
            - frontend/dist/**
      - step:
          name: Deploy Frontend to GoDaddy
          script:
            - echo "Checking local build artifacts:"
            - ls -la frontend/dist
            - pipe: atlassian/ftp-deploy:0.7.0
              variables:
                USER: $GODADDY_USER
                PASSWORD: $GODADDY_PASSWORD
                SERVER: $GODADDY_HOST
                REMOTE_PATH: $GODADDY_FRONTEND_PATH
                LOCAL_PATH: 'frontend/dist'
                DELETE_FLAG: 'true'
                DEBUG: 'true'

    deploy-cms:
      - step:
          name: Build Backend (Payload CMS)
          caches:
            - npm-backend
          script:
            - cd backend
            - npm ci
            - npm run build
          artifacts:
            - backend/.next/**
            - backend/public/**
            - backend/package.json
            - backend/package-lock.json
            - backend/server.js
      - step:
          name: Deploy Backend to GoDaddy Node App
          script:
            - pipe: atlassian/ftp-deploy:0.3.7
              variables:
                USER: $GODADDY_USER
                PASSWORD: $GODADDY_PASSWORD
                SERVER: $GODADDY_HOST
                REMOTE_PATH: $GODADDY_BACKEND_PATH
                LOCAL_PATH: 'backend'

    sync-backend-github:
      - step:
          name: Sync Backend to GitHub (GoDaddy Node App)
          script:
            - apk add --no-cache git
            - cd backend
            - git init -b main
            - git config user.name "Bitbucket CI"
            - git config user.email "ci@bitbucket.org"
            - git add .
            - git commit -m "Sync backend from Bitbucket"
            - git push https://x-access-token:$GITHUB_TOKEN@github.com/${GITHUB_REPO}.git main --force
