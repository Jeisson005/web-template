# ==============================================================================
# Bitbucket Pipelines - CI/CD for GoDaddy Deployment
# ==============================================================================
# Variables requeridas en Bitbucket (Repository Settings -> Repository Variables):
#   - HOST:                      Dominio del sitio (ej. smartmaps360.ai)
#   - GODADDY_USER:              Usuario FTP / cPanel
#   - GODADDY_PASSWORD:          Contraseña FTP / cPanel (Secured)
#   - GITHUB_TOKEN:              Token de acceso personal de GitHub (Secured)
#   - GITHUB_REPO:               (Opcional) Repositorio GitHub para GoDaddy (ej. Intelligis-Colombia/smartmaps-cms)
#
# Variables opcionales de seguridad y servicios (Backend / Formulario):
#   - PUBLIC_RECAPTCHA_SITE_KEY: Clave pública del reCAPTCHA v2 para el frontend
#   - RECAPTCHA_SECRET_KEY:      Clave secreta del reCAPTCHA v2 (Secured, inyectada a backend/.env)
#   - ZOHO_CRM_XNQSJSDP:         Token del formulario Zoho CRM (inyectada a backend/.env)
#   - ZOHO_CRM_XMIWTLD:          Token del formulario Zoho CRM (inyectada a backend/.env)
#   - ZOHO_CRM_SERVICE:          Servicio en Zoho CRM (por defecto: smarturl)
#   - ZOHO_CRM_LEADCF14:         Segmento en Zoho CRM (por defecto: SmartMaps Pro)
#   - CONTACT_WEBHOOK_URL:       Webhook de reenvío opcional (inyectada a backend/.env)
#
# Variables con valores por defecto automáticos (derivadas de $HOST):
#   - GODADDY_HOST:              Toma $HOST por defecto
#   - GODADDY_FRONTEND_PATH:     Toma "/" (raíz) por defecto
#   - GODADDY_SERVICES_PATH:     Toma "${GODADDY_FRONTEND_PATH}/backend" por defecto
#   - SITE_URL:                  Toma "https://${HOST}" por defecto
#   - PUBLIC_CMS_URL:            Toma "https://cms.${HOST}" por defecto
#   - GODADDY_CMS_PATH:          Toma "/cms" por defecto
# ==============================================================================

image: node:22-alpine

definitions:
  caches:
    npm-frontend: frontend/node_modules
    npm-cms: cms/node_modules

  steps:
    - step: &build-frontend
        name: Build Frontend (Astro SSG)
        caches:
          - npm-frontend
        script:
          - export HOST="${HOST:-$GODADDY_HOST}"
          - export SITE_URL="${SITE_URL:-https://${HOST}}"
          - export PUBLIC_CMS_URL="${PUBLIC_CMS_URL:-https://cms.${HOST}}"
          - export PUBLIC_RECAPTCHA_SITE_KEY="${PUBLIC_RECAPTCHA_SITE_KEY}"
          - cd frontend
          - npm ci
          - npm run build
        artifacts:
          - frontend/dist/**

    - step: &deploy-frontend
        name: Deploy Frontend to GoDaddy
        trigger: manual
        script:
          - echo "Checking local build artifacts:"
          - ls -la frontend/dist
          - pipe: atlassian/ftp-deploy:0.7.0
            variables:
              USER: $GODADDY_USER
              PASSWORD: $GODADDY_PASSWORD
              SERVER: ${GODADDY_HOST:-$HOST}
              REMOTE_PATH: ${GODADDY_FRONTEND_PATH:-"/"}
              LOCAL_PATH: 'frontend/dist'
              DELETE_FLAG: 'true'
              DEBUG: 'true'

    - step: &deploy-backend
        name: Deploy Backend Services to GoDaddy
        script:
          - echo "Generating backend/.env from Bitbucket environment variables..."
          - echo "# Generated by Bitbucket CI" > backend/.env
          - '[ -n "$RECAPTCHA_SECRET_KEY" ] && echo "RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}" >> backend/.env'
          - '[ -n "$ZOHO_CRM_XNQSJSDP" ] && echo "ZOHO_CRM_XNQSJSDP=${ZOHO_CRM_XNQSJSDP}" >> backend/.env'
          - '[ -n "$ZOHO_CRM_XMIWTLD" ] && echo "ZOHO_CRM_XMIWTLD=${ZOHO_CRM_XMIWTLD}" >> backend/.env'
          - '[ -n "$ZOHO_CRM_SERVICE" ] && echo "ZOHO_CRM_SERVICE=${ZOHO_CRM_SERVICE}" >> backend/.env'
          - '[ -n "$ZOHO_CRM_LEADCF14" ] && echo "ZOHO_CRM_LEADCF14=${ZOHO_CRM_LEADCF14}" >> backend/.env'
          - '[ -n "$CONTACT_WEBHOOK_URL" ] && echo "CONTACT_WEBHOOK_URL=${CONTACT_WEBHOOK_URL}" >> backend/.env'
          - pipe: atlassian/ftp-deploy:0.7.0
            variables:
              USER: $GODADDY_USER
              PASSWORD: $GODADDY_PASSWORD
              SERVER: ${GODADDY_HOST:-$HOST}
              REMOTE_PATH: ${GODADDY_SERVICES_PATH:-"${GODADDY_FRONTEND_PATH:-/}/backend"}
              LOCAL_PATH: 'backend'
              DELETE_FLAG: 'false'
              DEBUG: 'true'

    - step: &sync-cms
        name: Sync CMS to GitHub (GoDaddy Node App)
        script:
          - apk add --no-cache git
          - cd cms
          - git init -b main
          - git config user.name "Bitbucket CI"
          - git config user.email "ci@bitbucket.org"
          - git add .
          - git commit -m "Sync cms from Bitbucket"
          - git push https://x-access-token:$GITHUB_TOKEN@github.com/${GITHUB_REPO}.git main --force

pipelines:
  branches:
    main:
      - step: *build-frontend
      - step: *deploy-frontend
      - step: *deploy-backend
      - step: *sync-cms
    prod:
      - step: *build-frontend
      - step: *deploy-frontend
      - step: *deploy-backend
      - step: *sync-cms

  custom:
    deploy-frontend:
      - step: *build-frontend
      - step: *deploy-frontend

    deploy-backend:
      - step: *deploy-backend

    deploy-cms:
      - step:
          name: Build CMS (Payload CMS)
          caches:
            - npm-cms
          script:
            - cd cms
            - npm ci
            - npm run build
          artifacts:
            - cms/.next/**
            - cms/public/**
            - cms/package.json
            - cms/package-lock.json
            - cms/server.js
      - step:
          name: Deploy CMS to GoDaddy Node App
          script:
            - pipe: atlassian/ftp-deploy:0.3.7
              variables:
                USER: $GODADDY_USER
                PASSWORD: $GODADDY_PASSWORD
                SERVER: ${GODADDY_HOST:-$HOST}
                REMOTE_PATH: ${GODADDY_CMS_PATH:-"${GODADDY_BACKEND_PATH:-/cms}"}
                LOCAL_PATH: 'cms'

    sync-cms-github:
      - step: *sync-cms
